name: Air quality pipeline tests

on:
  push:
    paths:
      - 'projects/05-python-air-quality/**'
      - '.github/workflows/air-quality-tests.yml'
  pull_request:
    paths:
      - 'projects/05-python-air-quality/**'
      - '.github/workflows/air-quality-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.12 standard-library tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Run air-quality pipeline tests
        run: python -m unittest discover -s projects/05-python-air-quality -v
